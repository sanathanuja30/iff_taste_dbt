version: 2

seeds:
  - name: customers
    description: "Raw customer master data – 74 records, single batch"
  - name: flavours
    description: "Raw flavours – 500 unique IDs across 2 batches (1000 rows total)"
  - name: ingredients
    description: "Raw ingredients – 299 records"
  - name: providers
    description: "Raw provider master data – 215 records"
  - name: raw_materials
    description: "Raw material reference – 199 records"
  - name: recipes
    description: "Raw recipe combinations – ~166k records"
  - name: sales_transactions
    description: "Raw sales events – ~50k records"

models:
  # ---------- SILVER ----------
  - name: slv_customers
    description: "Cleaned and deduplicated customers"
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: slv_providers
    description: "Cleaned and deduplicated providers"
    columns:
      - name: provider_id
        tests: [unique, not_null]

  - name: slv_flavours_current
    description: "Latest flavour description (current snapshot)"
    columns:
      - name: flavour_id
        tests: [unique, not_null]

  - name: slv_flavours_history
    description: "SCD2 flavour description history"
    columns:
      - name: flavour_version_key
        tests: [unique, not_null]

  - name: slv_ingredients
    description: "Cleaned ingredients"
    columns:
      - name: ingredient_id
        tests: [unique, not_null]
      - name: cost_per_gram
        tests: [not_null]
      - name: weight_in_grams
        tests: [not_null]

  - name: slv_raw_materials
    description: "Cleaned raw materials"
    columns:
      - name: raw_material_id
        tests: [unique, not_null]

  - name: slv_recipes
    description: "Cleaned recipes with heat_process_flag"
    columns:
      - name: recipe_id
        tests: [unique, not_null]
      - name: yield_pct
        tests: [not_null]

  - name: slv_sales_transactions
    description: "Cleaned transactions, country normalised to Title Case"
    columns:
      - name: transaction_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('slv_customers')
              field: customer_id
      - name: flavour_id
        tests:
          - not_null
          - relationships:
              to: ref('slv_flavours_current')
              field: flavour_id
      - name: amount_dollar
        tests: [not_null]

  # ---------- GOLD ----------
  - name: dim_country
    description: "Unified country dimension from all three sources"
    columns:
      - name: country_key
        tests: [unique, not_null]
      - name: country_name
        tests: [unique, not_null]

  - name: dim_provider
    description: "Provider dimension with country_key FK"
    columns:
      - name: provider_key
        tests: [unique, not_null]

  - name: dim_customer
    description: "Customer dimension with country_key FK"
    columns:
      - name: customer_key
        tests: [unique, not_null]

  - name: dim_flavour
    description: "Current flavour snapshot"
    columns:
      - name: flavour_key
        tests: [unique, not_null]

  - name: dim_flavour_history
    description: "SCD2 flavour history – Flavour Description Tracker"
    columns:
      - name: flavour_version_key
        tests: [unique, not_null]

  - name: dim_ingredient
    description: "Ingredient dimension with denormalised provider info"
    columns:
      - name: ingredient_key
        tests: [unique, not_null]

  - name: dim_raw_material
    description: "Raw material dimension"
    columns:
      - name: raw_material_key
        tests: [unique, not_null]

  - name: dim_date
    description: "Date dimension spanning transaction date range"
    columns:
      - name: date_key
        tests: [unique, not_null]

  - name: fact_recipes
    description: "Recipe fact – grain: one recipe per row"
    columns:
      - name: recipe_id
        tests: [unique, not_null]
      - name: raw_material_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_raw_material')
              field: raw_material_id
      - name: flavour_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_flavour')
              field: flavour_id
      - name: ingredient_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_ingredient')
              field: ingredient_id

  - name: fact_sales_transactions
    description: "Sales fact – grain: one transaction per row"
    columns:
      - name: transaction_id
        tests: [unique, not_null]
      - name: customer_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: flavour_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_flavour')
              field: flavour_id

  - name: fact_provider_inventory
    description: "Provider inventory fact – grain: one ingredient per row"
    columns:
      - name: ingredient_key
        tests: [unique, not_null]
      - name: stock_value_dollar
        tests: [not_null]
